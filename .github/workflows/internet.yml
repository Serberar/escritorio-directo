name: Prueba por internet
# Dos máquinas en redes distintas se conectan solo con el ID.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  host:
    runs-on: windows-latest
    timeout-minutes: 8
    steps: &pasos
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - run: node test/internet.js ${{ github.job == 'visor' && 'visor' || 'host' }} ci-${{ github.run_id }}
  visor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps: *pasos
